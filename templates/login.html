<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MealMate AI</title>
    <style>
        /* Light Mode (Default) */
        :root {
            --bg-primary: #f0fdf4;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        /* Dark Mode */
        body.dark-mode {
            --bg-primary: #0a0f1c;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --card-bg: #1a1f2e;
            --border-color: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* FIX: No scrolling - fixed full height */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background-image: url('{{ url_for("static", filename="images/login_bg.avif") }}');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            margin: 0;
            padding: 2rem;
            background-color: var(--bg-primary);
            transition: background 0.3s ease;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }
        
        body.dark-mode::before {
            background: rgba(0, 0, 0, 0.6);
        }
        
        .login-container {
            width: 100%;
            max-width: 600px;
            margin-right: 15%;
            margin-left: auto;
            position: relative;
            z-index: 1;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            /* FIX: No internal scrolling */
            overflow: visible;
            max-height: none;
        }
        
        body.dark-mode .glass-card {
            background: rgba(10, 15, 28, 0.8);
            border: 1px solid rgba(5, 150, 105, 0.3);
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }
        
        body.dark-mode .glass-card:hover {
            background: rgba(10, 15, 28, 0.9);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            opacity: 0.9;
        }
        
        .back-link:hover {
            opacity: 1;
            transform: translateX(-5px);
        }
        
        h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: white;
            font-size: 1rem;
            opacity: 0.9;
        }
        
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: #1f2937;
        }
        
        body.dark-mode input {
            background: rgba(30, 35, 50, 0.9);
            color: #e5e7eb;
            border: 1px solid rgba(5, 150, 105, 0.3);
        }
        
        input:focus {
            outline: none;
            background: white;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        
        body.dark-mode input:focus {
            background: #1a1f2e;
        }
        
        input::placeholder {
            color: #9ca3af;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #6b7280;
        }
        
        body.dark-mode .toggle-password {
            color: #9ca3af;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 1.5rem;
        }
        
        .forgot-password a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .forgot-password a:hover {
            color: white;
            text-decoration: underline;
        }
        
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .register-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        /* Demo Credentials Styles */
        .demo-credentials {
            text-align: center;
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        body.dark-mode .demo-credentials {
            background: rgba(5, 150, 105, 0.1);
        }
        
        .demo-credentials p {
            margin: 0.25rem 0;
        }
        
        .demo-credentials p:first-child {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .error-message {
            background: rgba(254, 226, 226, 0.9);
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .success-message {
            background: rgba(209, 250, 229, 0.9);
            color: #059669;
            padding: 0.75rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding: 1rem;
            }
            
            .login-container {
                margin-right: auto;
                margin-left: auto;
            }
            
            .glass-card {
                padding: 1.5rem;
            }
            
            h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="glass-card">
            <a href="/" class="back-link">← Back to Home</a>
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to continue your health journey</p>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email or Phone Number</label>
                    <input type="text" id="username" required placeholder="email@example.com or +1234567890">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                    </div>
                </div>
                
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-login">Login</button>
            </form>
            
            <div class="register-link">
                Don't have an account? <a href="/register">Create Account</a>
            </div>
            
            
        </div>
    </div>
    
    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === "password" ? "text" : "password";
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (!username || !password) {
                errorDiv.textContent = 'Please fill all fields';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    successDiv.textContent = 'Login successful! Redirecting...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            }
        }
        
        // ========== THEME AUTO-APPLY ==========
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }
        
        // Apply theme when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadTheme();
        });
        // ========== END OF THEME CODE ==========
    </script>
</body>
</html>
